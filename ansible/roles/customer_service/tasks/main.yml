---
- name: Ensure prerequisite OS packages and Python are installed
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - tar
    state: present

- name: Create application installation directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: Deploy application source files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
  loop:
    - { src: "../../../app.py", dest: "{{ app_dir }}/app.py" }
    - { src: "../../../run.py", dest: "{{ app_dir }}/run.py" }
    - { src: "../../../requirements.txt", dest: "{{ app_dir }}/requirements.txt" }
  notify: Restart customer service

- name: Create Python virtual environment and install application dependencies
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_venv_dir }}"
    virtualenv_command: "{{ app_python_bin }} -m venv"
  notify: Restart customer service

- name: Configure systemd service unit from template
  ansible.builtin.template:
    src: customer-service.service.j2
    dest: "{{ systemd_service_path }}/{{ app_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd daemon
    - Restart customer service

- name: Flush handlers to trigger daemon-reload and restart immediately
  ansible.builtin.meta: flush_handlers

- name: Ensure customer service is enabled and started
  ansible.builtin.systemd:
    name: "{{ app_service_name }}"
    state: started
    enabled: true
